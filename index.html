<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>孟路涵是GAY</title>
    <style>
        /* 这里是网页的样式 */
        body {
            /* 1. 让整个页面高度占满屏幕 */
            height: 100vh; 
            /* 2. 去掉浏览器默认的边缘留白 */
            margin: 0; 
            /* 3. 开启弹性布局（Flexbox），这是实现居中最简单的办法 */
            display: flex; 
            /* 4. 水平居中 */
            justify-content: center; 
            /* 5. 垂直居中 */
            align-items: center; 
            /* 6. 背景颜色（可选，浅灰色，让字更显眼） */
            background-color: #f0f0f0; 
        }

        h1 {
            /* 7. 把字号放大（60像素） */
            font-size: 60px; 
            /* 8. 设置字体颜色（深灰色） */
            color: #333333;
            /* 9. 让文字所在位置居中 */
            text-align: center;
            /* 10. 可选：限制一下宽度，防止手机上看时字超出屏幕 */
            padding: 0 20px; 
        }
    </style>
</head>
<body>
    <!-- 这里是你想展示的文字 -->
    <h1>孟路涵，你是gay！！</h1>
</body>
</html>
